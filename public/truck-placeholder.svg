<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Food truck placeholder">
  <defs>
    <!-- subtle brick wall pattern -->
    <pattern id="brick" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#C8D2D6"/>
      <rect width="64" height="2" y="30" fill="#A8B2B8"/>
      <rect width="2" height="30" x="0" fill="#A8B2B8"/>
      <rect width="2" height="30" x="32" y="32" fill="#A8B2B8" transform="translate(0,-32)"/>
    </pattern>
    <pattern id="brick2" width="64" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(32,0)">
      <rect width="64" height="32" fill="#C8D2D6"/>
      <rect width="64" height="2" y="30" fill="#A8B2B8"/>
      <rect width="2" height="30" x="0" fill="#A8B2B8"/>
    </pattern>

    <!-- light shadow under the truck -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- gloss highlight on the body -->
    <linearGradient id="bodyGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#F8F8F8"/>
      <stop offset="100%" stop-color="#E5E5E5"/>
    </linearGradient>
  </defs>

  <!-- wall (two staggered rows for a real brick look) -->
  <rect width="800" height="430" fill="url(#brick)"/>
  <g opacity=".85">
    <rect y="16" width="800" height="32" fill="url(#brick2)"/>
    <rect y="80" width="800" height="32" fill="url(#brick2)"/>
    <rect y="144" width="800" height="32" fill="url(#brick2)"/>
    <rect y="208" width="800" height="32" fill="url(#brick2)"/>
    <rect y="272" width="800" height="32" fill="url(#brick2)"/>
    <rect y="336" width="800" height="32" fill="url(#brick2)"/>
  </g>

  <!-- floor -->
  <rect y="430" width="800" height="130" fill="#8A9499"/>
  <rect y="430" width="800" height="2" fill="#6F787C"/>

  <!-- contact shadow -->
  <ellipse cx="430" cy="490" rx="320" ry="22" fill="url(#floorShadow)"/>

  <!-- ============== TRUCK =============== -->
  <!-- cabin -->
  <g>
    <rect x="80" y="220" width="160" height="220" rx="14" fill="url(#bodyGloss)" stroke="#1B1B1B" stroke-width="2.5"/>
    <!-- cabin window -->
    <path d="M 110 235 H 230 L 240 285 H 100 Z" fill="#2A363B"/>
    <path d="M 114 238 H 226 L 234 278 H 106 Z" fill="#384950" opacity=".9"/>
    <line x1="170" y1="238" x2="170" y2="282" stroke="#1B1B1B" stroke-width="2"/>
    <!-- side mirror -->
    <rect x="60"  y="240" width="20" height="36" rx="3" fill="#1B1B1B"/>
    <rect x="62"  y="244" width="16" height="28" rx="2" fill="#5C6B70"/>
    <!-- headlight -->
    <ellipse cx="92" cy="356" rx="14" ry="10" fill="#FFE5A8" stroke="#1B1B1B" stroke-width="2"/>
    <!-- grille -->
    <rect x="80" y="380" width="60" height="38" rx="3" fill="#1B1B1B"/>
    <g stroke="#444" stroke-width="2">
      <line x1="85" y1="390" x2="135" y2="390"/>
      <line x1="85" y1="400" x2="135" y2="400"/>
      <line x1="85" y1="410" x2="135" y2="410"/>
    </g>
    <!-- door handle -->
    <rect x="218" y="335" width="14" height="5" rx="2" fill="#1B1B1B"/>
    <!-- door line -->
    <line x1="170" y1="290" x2="170" y2="440" stroke="#C0C0C0" stroke-width="1.5"/>
  </g>

  <!-- service body -->
  <g>
    <rect x="232" y="170" width="500" height="270" rx="10" fill="url(#bodyGloss)" stroke="#1B1B1B" stroke-width="2.5"/>

    <!-- service hatch (open) -->
    <g>
      <!-- hatch interior -->
      <rect x="260" y="240" width="430" height="120" fill="#2F3A40"/>
      <rect x="266" y="246" width="418" height="108" fill="#1B2326"/>

      <!-- counter shelf inside -->
      <rect x="266" y="332" width="418" height="22" fill="#DDDDDD"/>
      <rect x="266" y="354" width="418" height="6"  fill="#A8A8A8"/>

      <!-- two small lights inside -->
      <circle cx="320" cy="262" r="6"  fill="#FFE7A6" opacity=".85"/>
      <circle cx="475" cy="262" r="6"  fill="#FFE7A6" opacity=".85"/>
      <circle cx="630" cy="262" r="6"  fill="#FFE7A6" opacity=".85"/>

      <!-- abstract kitchen silhouettes inside -->
      <rect x="290" y="290" width="60" height="40" rx="4" fill="#3C4A50"/>
      <rect x="380" y="282" width="80" height="48" rx="4" fill="#3C4A50"/>
      <rect x="500" y="294" width="50" height="36" rx="4" fill="#3C4A50"/>
      <rect x="585" y="288" width="70" height="42" rx="4" fill="#3C4A50"/>
    </g>

    <!-- awning -->
    <g>
      <!-- striped fabric: orange + white -->
      <rect x="248" y="190" width="470" height="48" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2"/>
      <g fill="#FF6133">
        <rect x="248"  y="190" width="34" height="48"/>
        <rect x="316"  y="190" width="34" height="48"/>
        <rect x="384"  y="190" width="34" height="48"/>
        <rect x="452"  y="190" width="34" height="48"/>
        <rect x="520"  y="190" width="34" height="48"/>
        <rect x="588"  y="190" width="34" height="48"/>
        <rect x="656"  y="190" width="62" height="48"/>
      </g>
      <!-- scalloped bottom edge -->
      <path d="M 248 238
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  q 17 12 34 0
               q 17 12 34 0  V 238 Z" fill="#FF6133"/>
      <!-- support arms -->
      <line x1="252" y1="240" x2="232" y2="180" stroke="#5C5C5C" stroke-width="2"/>
      <line x1="714" y1="240" x2="732" y2="180" stroke="#5C5C5C" stroke-width="2"/>
    </g>
  </g>

  <!-- WHEELS -->
  <g>
    <!-- wheel arch shadow -->
    <ellipse cx="160" cy="442" rx="50" ry="14" fill="#000" opacity=".15"/>
    <ellipse cx="610" cy="442" rx="55" ry="14" fill="#000" opacity=".15"/>

    <!-- front wheel -->
    <circle cx="160" cy="438" r="38" fill="#1A1A1A"/>
    <circle cx="160" cy="438" r="30" fill="#2A2A2A"/>
    <circle cx="160" cy="438" r="12" fill="#9A9A9A"/>
    <circle cx="160" cy="438" r="4"  fill="#1A1A1A"/>
    <g stroke="#9A9A9A" stroke-width="2">
      <line x1="148" y1="438" x2="172" y2="438"/>
      <line x1="160" y1="426" x2="160" y2="450"/>
      <line x1="151" y1="429" x2="169" y2="447"/>
      <line x1="169" y1="429" x2="151" y2="447"/>
    </g>

    <!-- rear wheel -->
    <circle cx="610" cy="438" r="42" fill="#1A1A1A"/>
    <circle cx="610" cy="438" r="34" fill="#2A2A2A"/>
    <circle cx="610" cy="438" r="14" fill="#9A9A9A"/>
    <circle cx="610" cy="438" r="5"  fill="#1A1A1A"/>
    <g stroke="#9A9A9A" stroke-width="2">
      <line x1="596" y1="438" x2="624" y2="438"/>
      <line x1="610" y1="424" x2="610" y2="452"/>
      <line x1="600" y1="428" x2="620" y2="448"/>
      <line x1="620" y1="428" x2="600" y2="448"/>
    </g>
  </g>

  <!-- subtle floor reflection on truck side -->
  <rect x="232" y="430" width="500" height="10" fill="#000" opacity=".08"/>
  <rect x="80"  y="430" width="160" height="10" fill="#000" opacity=".08"/>

  <!-- placeholder label (only visible on hover via CSS if wanted) -->
  <g opacity=".0">
    <text x="400" y="540" font-family="Bebas Neue, sans-serif" font-size="22" fill="#fff" text-anchor="middle">Foto a chegar</text>
  </g>
</svg>
